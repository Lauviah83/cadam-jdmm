<style>
  /* Mise en page propre à la visionneuse de documents. */
  .doc {
    max-width: 72ch; margin: 0 auto;
    padding: var(--pas-5) var(--pas-5) var(--pas-9);
    /* Une URL ou un chemin long ne doit pas faire défiler la page
       horizontalement : il se replie. */
    overflow-wrap: break-word;
  }
  .doc h2 { margin: var(--pas-6) 0 var(--pas-3); font-size: var(--txt-lg); }
  .doc h3 { margin: var(--pas-5) 0 var(--pas-2); font-size: var(--txt-md); }
  .doc h4 { margin: var(--pas-4) 0 var(--pas-2); font-size: var(--txt-base);
            font-family: var(--police-texte); font-weight: var(--graisse-demi); }
  .doc p { margin: var(--pas-3) 0; }
  .doc .liste-doc { margin: var(--pas-3) 0; padding-left: var(--pas-5); list-style: disc; }
  .doc .liste-doc li { margin: var(--pas-2) 0; }
  .doc blockquote {
    margin: var(--pas-4) 0; padding: var(--pas-3) var(--pas-4);
    background: var(--glace); border-left: 3px solid var(--marque);
    border-radius: 0 var(--rayon-sm) var(--rayon-sm) 0;
  }
  .doc code {
    padding: 1px 5px; border-radius: var(--rayon-xs);
    background: var(--fond-alt); font-family: var(--police-mono); font-size: 0.9em;
  }
  .doc hr { margin: var(--pas-6) 0; border: none; border-top: 1px solid var(--bordure); }
  /* Un tableau large défile dans son cadre : la page, elle, ne défile jamais
     horizontalement. */
  .tableau-defilant { overflow-x: auto; margin: var(--pas-4) 0; }
  .doc table { width: 100%; border-collapse: collapse; font-size: var(--txt-sm); }
  .doc th, .doc td {
    padding: var(--pas-2) var(--pas-3); text-align: left;
    border-bottom: 1px solid var(--bordure); vertical-align: top;
  }
  .doc th { background: var(--fond-alt); font-weight: var(--graisse-demi); white-space: nowrap; }
</style>
</head>
